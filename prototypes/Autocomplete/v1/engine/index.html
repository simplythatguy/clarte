<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Prediction</title>
<style>
body { max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
input { box-sizing: border-box; width: 100%; }
.controls { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
<h1>Word Prediction</h1>
<p><label for="partner">Partner said</label><br><input id="partner" type="text"></p>
<p><label for="message">Message</label><br><input id="message" type="text"></p>
<p>Groups: <output id="groups"></output></p>
<div class="controls" id="letters">
<button type="button" data-group="1">1 ABCDEF</button>
<button type="button" data-group="2">2 GHIJKLMN</button>
<button type="button" data-group="3">3 OPQRS</button>
<button type="button" data-group="4">4 TUVWXYZ</button>
</div>
<p><output id="completion" aria-live="polite"></output></p>
<div class="controls">
<button id="accept" type="button" disabled>Accept</button>
<button id="delete" type="button">Delete</button>
<button id="choose" type="button" disabled>Choose</button>
<div id="chooser" hidden>
<label for="choices">Choose word</label>
<select id="choices"></select>
<button id="pick" type="button">Accept chosen word</button>
</div>
</div>
<p id="status" role="status"></p>
<pre id="lists"></pre>
</main>
<script>
const $ = id => document.getElementById(id);
let groups = '', latest = null, sequence = 0;
const isPrediction = true;
function commit(word) {
  if (!word) return;
  $('message').value = [$('message').value.trim(), word].filter(Boolean).join(' ');
  groups = '';
  refresh();
}
async function refresh() {
  const seq = ++sequence;
  latest = null;
  $('groups').textContent = groups;
  $('accept').disabled = true;
  $('completion').textContent = '';
  if (isPrediction) {
    $('choose').disabled = true;
    $('chooser').hidden = true;
    $('lists').textContent = '';
  }
  $('status').textContent = 'Loading…';
  try {
    const response = await fetch('/api/predict', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        history: $('partner').value.trim() ? [['partner', $('partner').value]] : [],
        message: $('message').value.trim().split(/\s+/).filter(Boolean), groups
      })
    });
    const data = await response.json();
    if (seq !== sequence) return;
    if (!response.ok) throw new Error(data.error || 'Prediction failed');
    latest = data;
    const word = isPrediction ? data.likely[0] : data.word;
    $('completion').textContent = word ? (isPrediction ? word : word + ' (' + (100 * data.probability).toFixed(2) + '%)') : '';
    $('accept').disabled = !word;
    $('status').textContent = word ? '' : 'No matching words. Delete a group.';
    if (isPrediction) {
      $('choose').disabled = !data.choose.length;
      $('lists').textContent = ['likely', 'choose', 'short', 'ghost', 'candidates'].map(key => key + ': ' + (Array.isArray(data[key]) ? data[key].join(', ') : data[key])).join('\n\n');
    }
  } catch (error) {
    if (seq === sequence) $('status').textContent = error.message;
  }
}
$('letters').addEventListener('click', event => {
  const group = event.target.dataset.group;
  if (group) { groups += group; refresh(); }
});
$('accept').onclick = () => { if (latest) commit(isPrediction ? latest.likely[0] : latest.word); };
$('delete').onclick = () => {
  if (groups) groups = groups.slice(0, -1);
  else {
    const words = $('message').value.trim().split(/\s+/).filter(Boolean);
    words.pop();
    $('message').value = words.join(' ');
  }
  refresh();
};
if (isPrediction) {
  $('choose').onclick = () => {
    if (!latest) return;
    $('choices').replaceChildren(...latest.choose.map(word => new Option(word, word)));
    $('chooser').hidden = !$('chooser').hidden;
  };
  $('pick').onclick = () => { if (latest) commit($('choices').value); };
}
$('partner').oninput = refresh;
$('message').oninput = refresh;
refresh();
</script>
</body>
</html>
