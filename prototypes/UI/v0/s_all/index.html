<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarte UI v0</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap" rel="stylesheet">
<style>
  :root { --canvas:#F5F5F7; --ink:#1D1D1F; --ink-2:#6E6E73; --hairline:#D2D2D7; --ease:cubic-bezier(0.23,1,0.32,1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--canvas); overflow: hidden; font-family: "Satoshi", -apple-system, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; display: none; background: var(--canvas); }
  iframe.on { display: block; }
  nav {
    position: fixed; top: 12px; right: 12px; z-index: 10;
    display: flex; flex-direction: column; gap: 4px; padding: 4px;
    background: rgba(255,255,255,.82); backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--hairline); border-radius: 22px;
    opacity: .55; transition: opacity 150ms var(--ease);
  }
  nav:hover, nav:focus-within { opacity: 1; }
  button {
    width: 36px; height: 36px; border: 0; border-radius: 18px; cursor: pointer;
    background: transparent; color: var(--ink-2); font: 700 13px/1 inherit; font-family: inherit;
    transition: background-color 150ms var(--ease), color 150ms var(--ease), scale 120ms var(--ease);
  }
  button:active { scale: .96; }
  @media (hover: hover) { button:hover { color: var(--ink); background: rgba(0,0,0,.05); } }
  button[aria-current="true"] { background: var(--ink); color: #fff; }
  button:focus-visible { outline: 2px solid #0071E3; outline-offset: 2px; }
</style>
</head>
<body>
<nav id="bar" aria-label="Styles"></nav>
<script>
  const H = location.hostname;
  // Styles open with ?onboarding=off: straight into the app, no calibration or first-run screens.
  const STYLES = [
    { id: 's0', name: 'S0 · Light mock (live prediction)', url: '/s0/index.html' },
    { id: 's1', name: 'S1 · Rails',    url: `http://${H}:5101/?onboarding=off` },
    { id: 's2', name: 'S2 · Corners',  url: `http://${H}:5102/?onboarding=off` },
    { id: 's3', name: 'S3 · Stages',   url: `http://${H}:5103/?onboarding=off` },
    { id: 's4', name: 'S4 · Split',    url: `http://${H}:5104/?onboarding=off` },
    { id: 's5', name: 'S5 · Dialogue', url: `http://${H}:5105/?onboarding=off` },
  ];
  const bar = document.getElementById('bar');
  const frames = {};
  function show(id) {
    const s = STYLES.find(x => x.id === id) || STYLES[0];
    if (!frames[s.id]) {
      const f = document.createElement('iframe');
      f.src = s.url; f.title = s.name; f.allow = 'microphone; autoplay';
      document.body.insertBefore(f, bar);
      frames[s.id] = f;
    }
    for (const [k, f] of Object.entries(frames)) f.classList.toggle('on', k === s.id);
    for (const b of bar.children) b.setAttribute('aria-current', String(b.dataset.id === s.id));
    document.title = `${s.name} · Clarte UI v0`;
    history.replaceState(null, '', `#${s.id}`);
    try { localStorage.setItem('clarte-s-all', s.id); } catch {}
    frames[s.id].focus();
  }
  for (const s of STYLES) {
    const b = document.createElement('button');
    b.textContent = s.id.toUpperCase(); b.dataset.id = s.id; b.title = s.name; b.setAttribute('aria-label', s.name);
    b.addEventListener('click', () => show(s.id));
    bar.append(b);
  }
  let start = location.hash.slice(1);
  if (!start) { try { start = localStorage.getItem('clarte-s-all'); } catch {} }
  show(start || 's0');
</script>
</body>
</html>
